services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trotinet}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://trotinet_app:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-trotinet}?schema=public
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ${UPLOAD_PATH:-./uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - private

volumes:
  postgres-data:

networks:
  private:
    driver: bridge